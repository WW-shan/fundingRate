version: '3.8'

services:
  funding-monitor:
    build: .
    container_name: funding-rate-monitor
    restart: unless-stopped
    cpu_shares: 128
    oom_score_adj: 500
    pids_limit: 128
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  data:
  logs:
