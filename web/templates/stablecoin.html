<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>稳定币监控 - 资金费率监控</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>📡 资金费率监控系统</h1>
      <div class="subtitle">市场异常监控 · 告警推送 · 纯监控模式（无交易）</div>
    </div>
    <div class="header-actions">
      <span class="last-update" id="last-update">--</span>
      <a href="/logout" class="btn btn-danger">退出</a>
    </div>
  </div>

  <div class="nav-menu">
    <a href="/" class="">仪表盘</a>
    <a href="/funding" class="">资金费率</a>
    <a href="/stablecoin" class="active">稳定币监控</a>
    <a href="/alerts" class="">告警历史</a>
    <a href="/config" class="">系统配置</a>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">监控资产</div><div class="stat-value" id="stat-count">--</div></div>
    <div class="stat-card"><div class="stat-label">预警中</div><div class="stat-value warn" id="stat-warn">--</div></div>
    <div class="stat-card"><div class="stat-label">严重脱锚</div><div class="stat-value negative" id="stat-critical">--</div></div>
  </div>

  <div class="card">
    <h3>🪙 锚定资产监控（稳定币 / 黄金 / 股票）</h3>
    <div class="filter-bar">
      <select id="filter-category" onchange="refresh()">
        <option value="">全部类别</option>
        <option value="usd_stable">稳定币</option>
        <option value="eur_stable">欧元稳定币</option>
        <option value="gold">黄金代币</option>
        <option value="stock">股票代币</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>资产</th><th>类别</th><th>交易所</th><th>当前价</th><th>参考价</th><th>偏离</th><th>状态</th><th>参考价时间</th></tr></thead>
        <tbody id="tbody-stable"><tr><td colspan="8" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>📉 历史价格曲线</h3>
    <div class="filter-bar">
      <select id="hist-symbol" onchange="loadHistory()">
        <option value="USDC">USDC</option>
        <option value="FDUSD">FDUSD</option>
        <option value="USDE">USDE</option>
        <option value="USD1">USD1</option>
        <option value="PAXG">PAXG（黄金）</option>
        <option value="XAUT">XAUT（黄金）</option>
        <option value="TSLAX">TSLAX（特斯拉）</option>
        <option value="NVDAX">NVDAX（英伟达）</option>
      </select>
      <select id="hist-hours" onchange="loadHistory()">
        <option value="6">近 6 小时</option>
        <option value="24" selected>近 24 小时</option>
        <option value="72">近 3 天</option>
        <option value="168">近 7 天</option>
      </select>
    </div>
    <div id="chart-container">
      <div class="empty-state">选择稳定币查看历史价格</div>
    </div>
  </div>

</div>
<script src="/static/js/common.js"></script>
<script>
async function refresh() {
  try {
    const cat = document.getElementById('filter-category').value;
    const res = await fetchJSON('/api/stablecoins' + (cat ? '?category=' + cat : ''));
    const rows = (res && res.data) || [];

    document.getElementById('stat-count').textContent = new Set(rows.map(r => r.symbol)).size;
    document.getElementById('stat-warn').textContent = rows.filter(r => r.abs_deviation >= r.threshold_warning && r.abs_deviation < r.threshold_critical).length;
    document.getElementById('stat-critical').textContent = rows.filter(r => r.abs_deviation >= r.threshold_critical).length;

    const catLabel = { usd_stable: '稳定币', eur_stable: '欧元', gold: '黄金', stock: '股票' };
    const tbody = document.getElementById('tbody-stable');
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无数据（等待采集）</td></tr>';
    } else {
      tbody.innerHTML = rows.map(r => {
        const cls = r.abs_deviation >= r.threshold_critical ? 'badge-red' : (r.abs_deviation >= r.threshold_warning ? 'badge-yellow' : 'badge-green');
        const label = r.abs_deviation >= r.threshold_critical ? '严重脱锚' : (r.abs_deviation >= r.threshold_warning ? '预警' : '正常');
        const priceStr = r.price < 1 ? r.price.toFixed(6) : r.price.toFixed(4);
        const refStr = r.reference < 1 ? r.reference.toFixed(6) : r.reference.toFixed(4);
        const closedTag = r.market_closed ? ' <span class="badge badge-gray" title="标的市场休市，参考价为最近收盘价">休市</span>' : '';
        const refTimeStr = r.reference_time ? new Date(r.reference_time * 1000).toLocaleString('zh-CN', { hour12: false }) : '实时';
        return `<tr>
          <td><b>${r.symbol}</b></td>
          <td><span class="badge badge-blue">${catLabel[r.category] || r.category}</span></td>
          <td>${exchangeBadge(r.exchange)}</td>
          <td class="mono">${priceStr}</td>
          <td class="mono text-muted">${refStr}</td>
          <td class="${pnlClass(r.deviation)}" ${Math.abs(r.deviation) >= r.threshold_warning ? 'style="font-weight:700"' : ''}>${(r.deviation * 100).toFixed(3)}%</td>
          <td><span class="badge ${cls}">${label}</span>${closedTag}</td>
          <td class="text-muted">${refTimeStr}</td>
        </tr>`;
      }).join('');
    }

    document.getElementById('last-update').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    console.error('refresh failed', e);
  }
}

async function loadHistory() {
  const symbol = document.getElementById('hist-symbol').value;
  const hours = document.getElementById('hist-hours').value;
  const container = document.getElementById('chart-container');
  container.innerHTML = '<div class="loading">加载中...</div>';

  try {
    const res = await fetchJSON(`/api/stablecoins/history?symbol=${encodeURIComponent(symbol)}&hours=${hours}`);
    const rows = (res && res.data) || [];
    if (rows.length < 2) {
      container.innerHTML = '<div class="empty-state">历史数据不足（需积累一段时间）</div>';
      return;
    }

    // 按交易所分组
    const byExchange = {};
    rows.forEach(r => {
      (byExchange[r.exchange] = byExchange[r.exchange] || []).push(r);
    });

    // 简单 SVG 折线图
    const W = 900, H = 320, PAD = 50;
    const allPrices = rows.map(r => r.price);
    const minP = Math.min(...allPrices, 0.995);
    const maxP = Math.max(...allPrices, 1.005);
    const minT = Math.min(...rows.map(r => r.timestamp));
    const maxT = Math.max(...rows.map(r => r.timestamp));

    const x = t => PAD + (t - minT) / (maxT - minT || 1) * (W - 2 * PAD);
    const y = p => H - PAD - (p - minP) / (maxP - minP || 1) * (H - 2 * PAD);

    const colors = { binance: '#f0b90b', okx: '#6b7280', bybit: '#f7a600', gate: '#2354e6', bitget: '#00f0ff' };
    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fafafa;border-radius:8px">`;

    // 网格线 + 1.0 基准线
    svg += `<line x1="${PAD}" y1="${y(1.0)}" x2="${W - PAD}" y2="${y(1.0)}" stroke="#9ca3af" stroke-dasharray="4,4" stroke-width="1"/>`;
    svg += `<text x="${W - PAD + 4}" y="${y(1.0) + 4}" font-size="11" fill="#6b7280">1.000</text>`;

    Object.entries(byExchange).forEach(([ex, pts]) => {
      const sorted = pts.slice().sort((a, b) => a.timestamp - b.timestamp);
      const d = sorted.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(p.timestamp).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ');
      svg += `<path d="${d}" fill="none" stroke="${colors[ex] || '#4f46e5'}" stroke-width="2"/>`;
    });

    svg += `</svg>`;

    // 图例
    const legend = Object.keys(byExchange).map(ex =>
      `<span style="margin-right:14px;font-size:12px"><span style="display:inline-block;width:10px;height:10px;background:${colors[ex] || '#4f46e5'};border-radius:2px;margin-right:4px"></span>${ex}</span>`
    ).join('');

    container.innerHTML = svg + `<div style="margin-top:10px">${legend}</div>`;
  } catch (e) {
    container.innerHTML = '<div class="empty-state">加载失败: ' + e.message + '</div>';
  }
}

refresh();
setInterval(refresh, 30000);
loadHistory();

</script>
</body>
</html>
