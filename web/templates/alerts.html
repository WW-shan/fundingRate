<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>告警历史 - 资金费率监控</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>📡 资金费率监控系统</h1>
      <div class="subtitle">市场异常监控 · 告警推送 · 纯监控模式（无交易）</div>
    </div>
    <div class="header-actions">
      <span class="last-update" id="last-update">--</span>
      <a href="/logout" class="btn btn-danger">退出</a>
    </div>
  </div>

  <div class="nav-menu">
    <a href="/" class="">仪表盘</a>
    <a href="/funding" class="">资金费率</a>
    <a href="/stablecoin" class="">锚定资产</a>
    <a href="/alerts" class="active">告警历史</a>
    <a href="/config" class="">系统配置</a>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">24h 告警总数</div><div class="stat-value" id="stat-total">--</div></div>
    <div class="stat-card"><div class="stat-label">资金费率异常</div><div class="stat-value warn" id="stat-funding">--</div></div>
    <div class="stat-card"><div class="stat-label">跨所费率差</div><div class="stat-value" id="stat-spread">--</div></div>
    <div class="stat-card"><div class="stat-label">基差异常</div><div class="stat-value" id="stat-basis">--</div></div>
    <div class="stat-card"><div class="stat-label">锚定资产脱锚</div><div class="stat-value negative" id="stat-depeg">--</div></div>
    <div class="stat-card"><div class="stat-label">其中已推送</div><div class="stat-value" id="stat-pushed">--</div></div>
  </div>

  <div class="card">
    <h3>🔔 告警记录</h3>
    <div class="filter-bar">
      <select id="filter-hours" onchange="refresh()">
        <option value="6">近 6 小时</option>
        <option value="24" selected>近 24 小时</option>
        <option value="72">近 3 天</option>
        <option value="168">近 7 天</option>
      </select>
      <select id="filter-level" onchange="refresh()">
        <option value="">全部级别</option>
        <option value="warning">预警</option>
        <option value="critical">严重</option>
      </select>
      <select id="filter-type" onchange="refresh()">
        <option value="">全部类型</option>
        <option value="funding_extreme">资金费率异常</option>
        <option value="cross_spread">跨所费率差</option>
        <option value="basis_extreme">基差异常</option>
        <option value="stablecoin_depeg">锚定资产脱锚</option>
        <option value="issuer_spread">跨产品 / 跨发行商价差</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>级别</th><th>类型</th><th>币种</th><th>交易所</th><th>消息</th></tr></thead>
        <tbody id="tbody-alerts"><tr><td colspan="6" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

</div>
<script src="/static/js/common.js"></script>
<script>
async function refresh() {
  const hours = document.getElementById('filter-hours').value;
  const level = document.getElementById('filter-level').value;
  const type = document.getElementById('filter-type').value;

  try {
    const [listRes, statsRes] = await Promise.all([
      fetchJSON(`/api/alerts?hours=${hours}&limit=500${level ? '&level=' + level : ''}${type ? '&type=' + type : ''}`),
      fetchJSON(`/api/alerts/stats?hours=${hours}`),
    ]);

    const stats = (statsRes && statsRes.data) || {};
    const byType = stats.by_type || {};
    document.getElementById('stat-total').textContent = stats.total || 0;
    document.getElementById('stat-funding').textContent = byType.funding_extreme || 0;
    document.getElementById('stat-spread').textContent = byType.cross_spread || 0;
    document.getElementById('stat-basis').textContent = byType.basis_extreme || 0;
    document.getElementById('stat-depeg').textContent = byType.stablecoin_depeg || 0;
    document.getElementById('stat-pushed').textContent = stats.pushed_total || 0;

    const rows = (listRes && listRes.data) || [];
    const tbody = document.getElementById('tbody-alerts');
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">该时间段内无告警</td></tr>';
    } else {
      tbody.innerHTML = rows.map(a => `<tr>
        <td class="text-muted">${fmtTime(a.timestamp)}</td>
        <td>${levelBadge(a.level)}</td>
        <td><span class="badge badge-blue">${typeLabel(a.alert_type)}</span></td>
        <td><b>${a.symbol || '-'}</b></td>
        <td>${a.exchange ? exchangeBadge(a.exchange.split('/')[0]) : '-'}</td>
        <td>${a.message}</td>
      </tr>`).join('');
    }

    document.getElementById('last-update').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    console.error('refresh failed', e);
  }
}

refresh();
setInterval(refresh, 20000);

</script>
</body>
</html>
