<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仪表盘 - 资金费率监控</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>📡 资金费率监控系统</h1>
      <div class="subtitle">市场异常监控 · 告警推送 · 纯监控模式（无交易）</div>
    </div>
    <div class="header-actions">
      <span class="last-update" id="last-update">--</span>
      <a href="/logout" class="btn btn-danger">退出</a>
    </div>
  </div>

  <div class="nav-menu">
    <a href="/" class="active">仪表盘</a>
    <a href="/funding" class="">资金费率</a>
    <a href="/stablecoin" class="">稳定币监控</a>
    <a href="/alerts" class="">告警历史</a>
    <a href="/config" class="">系统配置</a>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">监控币种</div><div class="stat-value" id="stat-symbols">--</div></div>
    <div class="stat-card"><div class="stat-label">已连交易所</div><div class="stat-value" id="stat-exchanges">--</div></div>
    <div class="stat-card"><div class="stat-label">24h 告警</div><div class="stat-value warn" id="stat-alerts">--</div></div>
    <div class="stat-card"><div class="stat-label">最高 APR</div><div class="stat-value positive" id="stat-top-apr">--</div></div>
  </div>

  <div class="card">
    <h3>🔥 APR 排行 Top10</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>币种</th><th>交易所</th><th>APR</th><th>单期费率</th><th>结算周期</th><th>下次结算</th></tr></thead>
        <tbody id="tbody-apr"><tr><td colspan="7" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>🔀 跨所费率差 Top10</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>币种</th><th>交易所对</th><th>年化差</th><th>APR A</th><th>APR B</th><th>备注</th></tr></thead>
        <tbody id="tbody-spread"><tr><td colspan="6" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>🪙 稳定币锚定状态</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>稳定币</th><th>交易所</th><th>价格</th><th>偏离</th><th>状态</th></tr></thead>
        <tbody id="tbody-stable"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>🔔 最近告警</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>级别</th><th>类型</th><th>消息</th></tr></thead>
        <tbody id="tbody-alerts"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

</div>
<script src="/static/js/common.js"></script>
<script>
async function refresh() {
  try {
    const [statusRes, summaryRes, alertsRes] = await Promise.all([
      fetchJSON('/api/status'),
      fetchJSON('/api/summary'),
      fetchJSON('/api/alerts?hours=24&limit=10'),
    ]);

    if (statusRes) {
      document.getElementById('stat-symbols').textContent = statusRes.symbols_tracked || 0;
      document.getElementById('stat-exchanges').textContent = (statusRes.exchanges || []).length;
      document.getElementById('stat-alerts').textContent = statusRes.alerts_24h || 0;
    }

    const data = (summaryRes && summaryRes.data) || {};
    const topApr = data.top_apr || [];
    if (topApr.length > 0 && topApr[0].apr !== null) {
      document.getElementById('stat-top-apr').textContent = fmtPct(topApr[0].apr, 1);
    }

    // APR 表
    const tbodyApr = document.getElementById('tbody-apr');
    if (topApr.length === 0) {
      tbodyApr.innerHTML = '<tr><td colspan="7" class="empty-state">暂无数据（等待采集）</td></tr>';
    } else {
      tbodyApr.innerHTML = topApr.map((r, i) => {
        const aprCls = r.apr > 0 ? 'text-green' : (r.apr < 0 ? 'text-red' : '');
        const interval = r.funding_interval_hours ? `每${r.funding_interval_hours}h` : '未知';
        const semantics = r.rate_semantics === 'last_settled' ? ' <span class="badge badge-gray" title="上期已结算">上期</span>' : '';
        return `<tr>
          <td>${i + 1}</td>
          <td><b>${r.symbol}</b></td>
          <td>${exchangeBadge(r.exchange)}${semantics}</td>
          <td class="${aprCls}">${fmtPct(r.apr, 2)}</td>
          <td class="${pnlClass(r.funding_rate)}">${fmtPct(r.funding_rate, 4)}</td>
          <td>${interval}</td>
          <td class="text-muted">${fmtTime(r.next_funding_time)}</td>
        </tr>`;
      }).join('');
    }

    // 跨所差表
    const spreads = data.top_spreads || [];
    const tbodySpread = document.getElementById('tbody-spread');
    if (spreads.length === 0) {
      tbodySpread.innerHTML = '<tr><td colspan="6" class="empty-state">暂无数据</td></tr>';
    } else {
      tbodySpread.innerHTML = spreads.map(r => `<tr>
        <td><b>${r.symbol}</b></td>
        <td>${exchangeBadge(r.exchange_a)} vs ${exchangeBadge(r.exchange_b)}</td>
        <td class="text-green">${fmtPct(r.abs_spread, 2)}</td>
        <td>${fmtPct(r.apr_a, 2)}</td>
        <td>${fmtPct(r.apr_b, 2)}</td>
        <td>${r.interval_mismatch ? '<span class="badge badge-yellow">周期不一致</span>' : ''}${r.semantics_mixed ? ' <span class="badge badge-gray">含上期值</span>' : ''}</td>
      </tr>`).join('');
    }

    // 稳定币表
    const depeg = data.depeg || [];
    const tbodyStable = document.getElementById('tbody-stable');
    if (depeg.length === 0) {
      tbodyStable.innerHTML = '<tr><td colspan="5" class="empty-state">暂无数据</td></tr>';
    } else {
      tbodyStable.innerHTML = depeg.map(r => {
        const cls = r.abs_deviation >= 0.01 ? 'badge-red' : (r.abs_deviation >= 0.003 ? 'badge-yellow' : 'badge-green');
        const label = r.abs_deviation >= 0.01 ? '严重脱锚' : (r.abs_deviation >= 0.003 ? '预警' : '正常');
        return `<tr>
          <td><b>${r.symbol}</b></td>
          <td>${exchangeBadge(r.exchange)}</td>
          <td class="mono">${r.price.toFixed(6)}</td>
          <td class="${pnlClass(r.deviation)}">${(r.deviation * 100).toFixed(3)}%</td>
          <td><span class="badge ${cls}">${label}</span></td>
        </tr>`;
      }).join('');
    }

    // 告警表
    const alerts = (alertsRes && alertsRes.data) || [];
    const tbodyAlerts = document.getElementById('tbody-alerts');
    if (alerts.length === 0) {
      tbodyAlerts.innerHTML = '<tr><td colspan="4" class="empty-state">24 小时内无告警</td></tr>';
    } else {
      tbodyAlerts.innerHTML = alerts.map(a => `<tr>
        <td class="text-muted">${fmtTime(a.timestamp)}</td>
        <td>${levelBadge(a.level)}</td>
        <td><span class="badge badge-blue">${typeLabel(a.alert_type)}</span></td>
        <td>${a.message}</td>
      </tr>`).join('');
    }

    document.getElementById('last-update').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    console.error('refresh failed', e);
  }
}

refresh();
setInterval(refresh, 15000);

</script>
</body>
</html>
