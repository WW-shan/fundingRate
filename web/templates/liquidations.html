<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爆仓量监控 - 资金费率监控</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>💥 爆仓量监控</h1>
      <div class="subtitle">五家交易所公开数据聚合 · 滚动窗口相对常态识别</div>
    </div>
    <div class="header-actions">
      <span class="last-update" id="last-update">--</span>
      <a href="/logout" class="btn btn-danger">退出</a>
    </div>
  </div>

  <div class="nav-menu">
    <a href="/" class="">仪表盘</a>
    <a href="/funding" class="">资金费率</a>
    <a href="/stablecoin" class="">锚定资产</a>
    <a href="/liquidations" class="active">爆仓量</a>
    <a href="/alerts" class="">告警历史</a>
  </div>

  <div class="card">
    <h3>数据连接</h3>
    <div id="connections" class="text-muted">连接中...</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">60s 空单爆仓</div><div class="stat-value negative" id="stat-short">--</div></div>
    <div class="stat-card"><div class="stat-label">60s 多单爆仓</div><div class="stat-value warn" id="stat-long">--</div></div>
    <div class="stat-card"><div class="stat-label">最大单笔强平</div><div class="stat-value" id="stat-max">--</div></div>
    <div class="stat-card"><div class="stat-label">当前数据源</div><div class="stat-value" id="stat-sources">--</div></div>
  </div>

  <div class="card">
    <h3>当前窗口排行</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>币种</th><th>方向</th><th>当前窗口</th><th>常态均值</th><th>放大倍数</th><th>最大单笔</th><th>爆仓均价</th><th>交易所分布</th></tr>
        </thead>
        <tbody id="tbody-liquidation"><tr><td colspan="8" class="loading">等待爆仓事件...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>最近分钟聚合</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>分钟</th><th>币种</th><th>方向</th><th>爆仓金额</th><th>事件数</th><th>最大单笔</th></tr></thead>
        <tbody id="tbody-history"><tr><td colspan="6" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script>
async function refresh() {
  try {
    const [currentRes, historyRes] = await Promise.all([
      fetchJSON('/api/liquidations?limit=200'),
      fetchJSON('/api/liquidations/history?hours=6&limit=80'),
    ]);
    const rows = (currentRes && currentRes.data) || [];
    const summary = currentRes.summary || {};
    const shortTotal = Number(summary.short_usd || 0);
    const longTotal = Number(summary.long_usd || 0);
    const maxOrder = Number(summary.max_order_usd || 0);
    document.getElementById('stat-short').textContent = fmtUsd(shortTotal);
    document.getElementById('stat-long').textContent = fmtUsd(longTotal);
    document.getElementById('stat-max').textContent = fmtUsd(maxOrder);
    const enabledCount = Number(currentRes.enabled_exchange_count || 5);
    document.getElementById('stat-sources').textContent = (currentRes.active_exchanges || []).length + ' / ' + enabledCount;

    const connections = currentRes.connections || {};
    document.getElementById('connections').innerHTML = Object.entries(connections).map(([name, state]) => {
      const connected = Boolean(state.connected);
      const active = Boolean(state.active);
      const label = active ? '在线' : (connected ? '无数据' : '重连中');
      const cls = active ? 'badge-green' : 'badge-red';
      return `${exchangeBadge(name)} <span class="badge ${cls}">${label}</span>`;
    }).join(' &nbsp; ');

    const tbody = document.getElementById('tbody-liquidation');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">尚无爆仓数据，等待行情或连接恢复</td></tr>';
    } else {
      tbody.innerHTML = rows.map(r => {
        const sideClass = r.side === 'short' ? 'text-red' : 'text-green';
        const breakdown = Object.entries(r.exchange_breakdown || {})
          .map(([name, value]) => `${exchangeBadge(name)} ${fmtUsd(value)}`).join(' ');
        const move = r.price_change_pct === null || r.price_change_pct === undefined
          ? '' : `<div class="${pnlClass(r.price_change_pct)}">${Number(r.price_change_pct).toFixed(2)}%</div>`;
        return `<tr>
          <td><b>${r.symbol}</b></td>
          <td class="${sideClass}"><b>${r.side_label || r.side}</b></td>
          <td><b>${fmtUsd(r.current_usd)}</b></td>
          <td>${fmtUsd(r.baseline_usd)}</td>
          <td><b>${r.ratio === null || r.ratio === undefined ? '基准不足' : Number(r.ratio).toFixed(1) + 'x'}</b></td>
          <td>${fmtUsd(r.max_order_usd)}</td>
          <td>${r.price ? Number(r.price).toPrecision(6) : '-'}${move}</td>
          <td>${breakdown || '-'}</td>
        </tr>`;
      }).join('');
    }

    const history = (historyRes && historyRes.data) || [];
    const historyBody = document.getElementById('tbody-history');
    if (!history.length) {
      historyBody.innerHTML = '<tr><td colspan="6" class="empty-state">分钟聚合会在采集后生成</td></tr>';
    } else {
      historyBody.innerHTML = history.map(r => `<tr>
        <td class="text-muted">${fmtTime(r.bucket)}</td>
        <td><b>${r.symbol}</b></td>
        <td class="${r.side === 'short' ? 'text-red' : 'text-green'}">${r.side === 'short' ? '空单' : '多单'}</td>
        <td><b>${fmtUsd(r.usd_value)}</b></td>
        <td>${r.event_count}</td>
        <td>${fmtUsd(r.max_order_usd)}</td>
      </tr>`).join('');
    }
    document.getElementById('last-update').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    console.error('liquidation refresh failed', e);
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
